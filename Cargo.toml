[package]
name = "ganggang"
version = "0.3.0"
edition = "2024"
description = "A small, sharp agentic harness in Rust: one agent loop, tools, and a TUI."
license = "MIT"
readme = "README.md"
repository = "https://github.com/dairycow/ganggang"
homepage = "https://github.com/dairycow/ganggang"
documentation = "https://dairycow.github.io/ganggang/"
keywords = ["agent", "ai", "cli", "tui"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".cargo/", ".claude/", ".github/", ".review-*.md", "AGENTS.md", ".agents/", "docs/", "scripts/", "TASKS.md", "GAP-ANALYSIS.md"]

[[bin]]
name = "gg"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
toml = "1.2.2"
ratatui = "0.30.2"
crossterm = "0.29.0"
ignore = "0.4"
regex = "1"
globset = "0.4"

[dev-dependencies]
tempfile = "3"
